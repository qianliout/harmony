server:
  port: 8080
  mode: "debug"

# 本机 MySQL：OrbStack 容器 mysql（~/work/docker/mysql），库 harmony 需先创建，见 README。
database:
  driver: "mysql"
  dsn: "root:root@tcp(127.0.0.1:3306)/harmony?charset=utf8mb4&parseTime=True&loc=Local"

storage:
  uploadDir: "data/uploads"

# 识别：默认走 DeepSeek 的 OpenAI 兼容接口；apiKey 由 HARMONY_RECOGNIZE_API_KEY 或 DEEPSEEK_API_KEY 注入，不写进文件。
recognize:
  provider: "deepseek"
  baseURL: "https://api.deepseek.com/v1"
  apiKey: ""
  model: "deepseek-chat"
  timeoutSeconds: 60
  temperature: 0
