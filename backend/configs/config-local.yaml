server:
  host: "127.0.0.1"
  port: 8080
  mode: "debug"

database:
  path: "data/harmony.db"

storage:
  uploadDir: "data/uploads"

# 识别：百炼通义千问视觉模型（OpenAI 兼容协议）；API Key 由 DASHSCOPE_API_KEY 等环境变量注入。
recognize:
  provider: "qwen"
  baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  apiKey: ""
  model: "qwen3-vl-plus"
  timeoutSeconds: 90
  temperature: 0
  highResolution: true
  dailyLimit: 100

auth:
  adminUserIds: [1]
  mpTokenDays: 30
  webTokenDays: 14

wechat:
  appID: "wx348e5ad03f9cd6ba"
  envVersion: "develop"

backup:
  dir: "data/backups"
  keepDays: 7
