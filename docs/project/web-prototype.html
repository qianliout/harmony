<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人情账本 Web 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 电脑宽屏版：左侧导航 + 顶栏 + 内容区；颜色、圆角、阴影沿用"朱砂礼簿" token（docs/03），只补桌面布局用的尺寸。 */
:root {
  color-scheme: light;
  --c-primary: #C8372D; --c-primary-dark: #A92B22; --c-primary-light: #FBEDEA;
  --c-in: #C8372D; --c-in-light: #FBEDEA;
  --c-out: #2E6E72; --c-out-light: #E5EFEF;
  --c-pending: #C27C0E; --c-pending-light: #FBF0DB;
  --c-repaid: #4F8A56; --c-repaid-light: #E8F1E7;
  --c-none: #8C8279; --c-none-light: #F0ECE7;
  --c-danger: #B42318; --c-danger-light: #FDECEA;
  --c-ink-1: #221C18; --c-ink-2: #5A504A; --c-ink-3: #968B83; --c-ink-4: #C7BEB6;
  --c-bg: #F6F2EC; --c-surface: #FFFFFF; --c-fill: #F2ECE4;
  --c-line: #EAE3DA; --c-divider: #F1ECE5; --c-mask: rgba(34, 28, 24, .45);
  --c-side: #FBF8F4; --c-hover: #FCFAF7; --c-on-primary: #FFFFFF; --c-on-primary-2: rgba(255, 255, 255, .8);
  --c-paper: #F3E9D6; --c-paper-ink: #2B2420; --c-paper-line: #D9C7A6;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;
  --r-xs: 6px; --r-s: 10px; --r-m: 14px; --r-l: 20px; --r-full: 999px;
  --shadow-card: 0 1px 2px rgba(74, 50, 30, .04), 0 2px 12px rgba(74, 50, 30, .05);
  --shadow-float: 0 8px 24px rgba(74, 50, 30, .14);

  --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
  --num: "DIN Alternate", "SF Pro Display", "Roboto", -apple-system, "PingFang SC", sans-serif;

  --side-w: 224px; --top-h: 64px; --gutter-x: 32px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--c-bg); color: var(--c-ink-1); font: 14px/22px var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--c-primary-light); color: var(--c-primary-dark); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; border-radius: var(--r-xs); }
a { color: inherit; text-decoration: none; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--c-line); border-radius: 10px; border: 2px solid var(--c-bg); }

/* 骨架 */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.app.bare { display: block; }
.app.bare .side, .app.bare .top { display: none; }
.app.bare main { padding: 0; }
.app.bare .wrap { max-width: none; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--sp-5); padding: var(--sp-5) var(--sp-3); background: var(--c-side); border-right: 1px solid var(--c-line); }
.brand { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2); }
.brand .stamp { width: 36px; height: 36px; border-radius: 8px; background: var(--c-primary); color: var(--c-on-primary); display: grid; place-items: center; font: 600 20px/1 var(--serif); }
.brand b { font-size: 16px; font-weight: 600; display: block; line-height: 22px; }
.brand small { color: var(--c-ink-3); font-size: 12px; line-height: 16px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h6 { margin: var(--sp-4) 0 var(--sp-1); padding: 0 var(--sp-3); font-size: 12px; font-weight: 500; color: var(--c-ink-3); }
.nav a { display: flex; align-items: center; gap: var(--sp-3); height: 38px; padding: 0 var(--sp-3); border-radius: var(--r-s); color: var(--c-ink-2); }
.nav a:hover { background: var(--c-fill); color: var(--c-ink-1); }
.nav a.on { background: var(--c-primary-light); color: var(--c-primary); font-weight: 500; }
.nav a .badge { margin-left: auto; font-size: 12px; color: var(--c-pending); font-family: var(--num); }
.side .me { margin-top: auto; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); border-radius: var(--r-s); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.me small { display: block; color: var(--c-ink-3); font-size: 12px; line-height: 16px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top-h); display: flex; align-items: center; gap: var(--sp-4); padding-left: max(var(--gutter-x), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter-x), env(safe-area-inset-right, 0px)); background: var(--c-bg); border-bottom: 1px solid var(--c-divider); }
.crumbs { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font-size: 13px; color: var(--c-ink-3); }
.crumbs a:hover { color: var(--c-ink-1); }
.crumbs b { color: var(--c-ink-1); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .search { margin-left: auto; width: 320px; max-width: 40vw; display: flex; align-items: center; gap: var(--sp-2); height: 38px; padding: 0 var(--sp-3); border-radius: var(--r-s); background: var(--c-surface); border: 1px solid var(--c-line); color: var(--c-ink-3); text-align: left; }
.top .search:hover { border-color: var(--c-ink-4); }
.top .search span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 500 11px/18px var(--sans); padding: 0 6px; border-radius: 4px; background: var(--c-fill); color: var(--c-ink-2); border: 1px solid var(--c-line); }
main { padding-block: var(--sp-6) 80px; padding-left: max(var(--gutter-x), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter-x), env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-7); }

/* 通用组件 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--c-line); background: var(--c-surface); color: var(--c-ink-1); font-weight: 500; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--c-ink-4); }
.btn.primary { background: var(--c-primary); border-color: var(--c-primary); color: var(--c-on-primary); }
.btn.primary:hover { background: var(--c-primary-dark); border-color: var(--c-primary-dark); }
.btn.danger { color: var(--c-danger); }
.btn.text { border-color: transparent; background: transparent; color: var(--c-ink-2); padding: 0 8px; }
.btn.text:hover { background: var(--c-fill); color: var(--c-ink-1); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg.i { width: 16px; height: 16px; }
.ipt, select.ipt, textarea.ipt { height: 36px; padding: 0 var(--sp-3); border-radius: var(--r-s); border: 1px solid transparent; background: var(--c-fill); outline: none; min-width: 0; transition: border-color .15s, background .15s; }
textarea.ipt { height: auto; padding: var(--sp-2) var(--sp-3); resize: vertical; line-height: 22px; }
.ipt:focus { border-color: var(--c-primary); background: var(--c-surface); }
.ipt::placeholder { color: var(--c-ink-3); }
select.ipt { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--c-ink-3) 50%), linear-gradient(135deg, var(--c-ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px; background-repeat: no-repeat; }
.seg { flex: none; display: inline-flex; padding: 3px; border-radius: var(--r-s); background: var(--c-fill); gap: 2px; }
.seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--c-ink-2); white-space: nowrap; }
.seg button.on { background: var(--c-surface); color: var(--c-ink-1); font-weight: 500; box-shadow: var(--shadow-card); }
.seg.dirseg button.on[data-v="收"] { color: var(--c-in); }
.seg.dirseg button.on[data-v="送"] { color: var(--c-out); }

.card { background: var(--c-surface); border-radius: var(--r-m); box-shadow: var(--shadow-card); }
.section { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
.sec-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.sec-head .sub { color: var(--c-ink-3); font-size: 13px; }
.sec-head .tools { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.page-head { display: flex; align-items: flex-end; gap: var(--sp-4); flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; text-wrap: balance; }
.page-head .meta { color: var(--c-ink-3); font-size: 13px; margin-top: 2px; }
.page-head .tools { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }

.seal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-xs); font: 600 14px/1 var(--serif); flex: none; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
.seal.lg { width: 44px; height: 44px; font-size: 24px; border-radius: 10px; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-full); font-size: 12px; white-space: nowrap; }
.pill.pending { background: var(--c-pending-light); color: var(--c-pending); }
.pill.repaid { background: var(--c-repaid-light); color: var(--c-repaid); }
.pill.none { background: var(--c-none-light); color: var(--c-none); }
.pill.back { background: var(--c-out-light); color: var(--c-out); }
.pill.neutral { background: var(--c-fill); color: var(--c-ink-2); }
.pill.warn { background: var(--c-danger-light); color: var(--c-danger); }
.dir { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.dir.in { background: var(--c-in-light); color: var(--c-in); }
.dir.out { background: var(--c-out-light); color: var(--c-out); }
.amt { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.amt.in { color: var(--c-in); } .amt.out { color: var(--c-out); } .amt.pend { color: var(--c-pending); }
.muted { color: var(--c-ink-3); }
.sm { font-size: 13px; }
.approx { font-size: 12px; color: var(--c-ink-3); margin-left: 2px; }
.empty { padding: var(--sp-8) var(--sp-4); text-align: center; color: var(--c-ink-3); }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--c-ink-3); padding: 10px 16px; border-bottom: 1px solid var(--c-divider); white-space: nowrap; }
.tbl td { padding: 11px 16px; border-bottom: 1px solid var(--c-divider); vertical-align: middle; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.link { cursor: pointer; }
.tbl tbody tr.link:hover td { background: var(--c-hover); }
.tbl tbody tr.sel td { background: var(--c-primary-light); }
.tbl .r { text-align: right; }
.tbl td.pend-bar { box-shadow: inset 3px 0 0 var(--c-pending); }
.tbl tfoot td { font-weight: 600; border-top: 1px solid var(--c-line); border-bottom: 0; }
.cell-2 { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.cell-2 .t { display: flex; flex-direction: column; min-width: 0; line-height: 20px; }
.cell-2 .t small { color: var(--c-ink-3); font-size: 12px; line-height: 16px; }
.chk { width: 16px; height: 16px; accent-color: var(--c-primary); }

/* 筛选栏：主维度在前，辅助条件收在后面 */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-divider); }
.filters .lbl { font-size: 12px; color: var(--c-ink-3); margin-right: 2px; }
.filters .gap { width: 1px; height: 20px; background: var(--c-line); margin: 0 var(--sp-2); }
.filters select.ipt, .filters .ipt { height: 32px; font-size: 13px; }
.filters .right { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; }
.sumbar { display: flex; gap: var(--sp-6); flex-wrap: wrap; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-divider); font-size: 13px; color: var(--c-ink-2); align-items: center; }
.sumbar .pager { margin-left: auto; display: flex; gap: var(--sp-1); align-items: center; }

/* 统计块：数字在上，标签在下 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-4); }
.stat { padding: var(--sp-4) var(--sp-5); }
.stat .v { font: 600 24px/32px var(--num); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 13px; color: var(--c-ink-3); margin-top: 2px; }
.stat .k a { color: var(--c-pending); }

/* 首页朱砂卡：全应用唯一一处大面积强色 */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-6); padding: var(--sp-6) var(--sp-7); border-radius: var(--r-m); color: var(--c-on-primary); background: linear-gradient(135deg, var(--c-primary), var(--c-primary-dark)); box-shadow: var(--shadow-float); position: relative; overflow: hidden; }
.hero::after { content: "礼"; position: absolute; right: 230px; bottom: -36px; font: 600 150px/1 var(--serif); color: rgba(255, 255, 255, .06); pointer-events: none; }
.hero .greet { font: 600 20px/28px var(--serif); }
.hero .greet small { font: 400 13px/20px var(--sans); color: var(--c-on-primary-2); margin-left: var(--sp-3); }
.hero .figs { display: flex; gap: var(--sp-8); margin-top: var(--sp-5); flex-wrap: wrap; }
.hero .figs .k { font-size: 13px; color: var(--c-on-primary-2); }
.hero .figs .v { font: 600 32px/40px var(--num); font-variant-numeric: tabular-nums; }
.hero .figs .v.s { font-size: 22px; line-height: 40px; }
.hero .owe { margin-top: var(--sp-4); display: inline-flex; align-items: center; gap: var(--sp-2); height: 32px; padding: 0 var(--sp-3); border-radius: var(--r-full); background: rgba(255, 255, 255, .14); font-size: 13px; }
.hero .owe:hover { background: rgba(255, 255, 255, .22); }
.hero .acts { display: flex; flex-direction: column; gap: var(--sp-2); justify-content: center; position: relative; z-index: 1; }
.hero .acts .btn { width: 200px; justify-content: flex-start; background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .22); color: var(--c-on-primary); }
.hero .acts .btn:hover { background: rgba(255, 255, 255, .2); }
.hero .acts .btn.main { background: var(--c-surface); color: var(--c-primary); border-color: var(--c-surface); }
.hero .acts .btn kbd { margin-left: auto; background: rgba(255, 255, 255, .16); color: var(--c-on-primary); border-color: transparent; }
.hero .acts .btn.main kbd { background: var(--c-primary-light); color: var(--c-primary); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
.grid-2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-6); align-items: start; }
.list { display: flex; flex-direction: column; }
.list .row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-divider); }
.list .row:last-child { border-bottom: 0; }
.list a.row:hover { background: var(--c-hover); }
.list .row .grow { flex: 1; min-width: 0; }
.list .row .grow small { display: block; color: var(--c-ink-3); font-size: 12px; line-height: 18px; }

/* 详情页头 */
.profile { display: flex; gap: var(--sp-4); align-items: center; }
.profile .avatar { width: 52px; height: 52px; font-size: 20px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--c-ink-3); font-size: 13px; }
.back:hover { color: var(--c-ink-1); }

/* 人详情时间线：按事项分组 */
.group { border-bottom: 1px solid var(--c-divider); }
.group:last-child { border-bottom: 0; }
.group-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-4) var(--sp-2); }
.group-head .t { flex: 1; min-width: 0; }
.group-head .t b { font-weight: 600; }
.group-head .t small { display: block; color: var(--c-ink-3); font-size: 12px; line-height: 16px; }
.group .tbl { table-layout: fixed; min-width: 640px; }
.group .tbl td { padding-top: 9px; padding-bottom: 9px; overflow: hidden; text-overflow: ellipsis; }
.group .tbl th:nth-child(1) { width: 52px; } .group .tbl th:nth-child(2) { width: 18%; } .group .tbl th:nth-child(3) { width: 24%; }
.group .tbl th:nth-child(4) { width: 14%; } .group .tbl th:nth-child(6) { width: 132px; }
.group .subtotal { display: flex; gap: var(--sp-4); font-size: 13px; color: var(--c-ink-2); }

/* 页内 tab */
.tabs { display: flex; gap: var(--sp-6); border-bottom: 1px solid var(--c-line); overflow-x: auto; overflow-y: hidden; }
.tabs button { height: 44px; border: 0; background: none; padding: 0; color: var(--c-ink-2); font-size: 15px; position: relative; white-space: nowrap; }
.tabs button.on { color: var(--c-ink-1); font-weight: 600; }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c-primary); border-radius: 2px; }
.tabs button .n { font-family: var(--num); color: var(--c-ink-3); margin-left: 4px; font-size: 13px; }

/* 抽屉、对话框、搜索面板 */
.mask { position: fixed; inset: 0; background: var(--c-mask); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.mask.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 100vw; background: var(--c-surface); box-shadow: var(--shadow-float); z-index: 50; display: flex; flex-direction: column; transform: translateX(104%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.drawer.on { transform: none; }
.drawer.notes { width: 380px; background: var(--c-side); }
.d-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-5) var(--sp-6) var(--sp-4); border-bottom: 1px solid var(--c-divider); padding-top: max(var(--sp-5), env(safe-area-inset-top, 0px)); }
.d-head h3 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
.d-body { flex: 1; overflow-y: auto; padding: var(--sp-5) var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4); }
.d-foot { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-4) var(--sp-6); border-top: 1px solid var(--c-divider); padding-bottom: max(var(--sp-4), env(safe-area-inset-bottom, 0px)); }
.d-foot .left { margin-right: auto; display: flex; gap: var(--sp-2); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; color: var(--c-ink-2); font-weight: 500; }
.field .hint { font-size: 12px; color: var(--c-ink-3); line-height: 18px; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.amount-in { position: relative; }
.amount-in .ipt { width: 100%; height: 52px; padding-left: 36px; font: 600 26px/1 var(--num); }
.amount-in::before { content: "¥"; position: absolute; left: 14px; top: 13px; font: 600 20px/26px var(--num); color: var(--c-ink-3); }
.upper { font-size: 13px; color: var(--c-ink-2); font-family: var(--serif); min-height: 20px; }
.alert { display: flex; gap: var(--sp-2); padding: var(--sp-3); border-radius: var(--r-s); font-size: 13px; line-height: 20px; }
.alert svg.i { width: 16px; height: 16px; margin-top: 2px; }
.alert.warn { background: var(--c-pending-light); color: var(--c-ink-1); }
.alert.warn svg { color: var(--c-pending); }
.alert.err { background: var(--c-danger-light); color: var(--c-danger); }
.alert.info { background: var(--c-fill); color: var(--c-ink-2); }
.dl { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px var(--sp-4); font-size: 14px; }

// ———————————————————— 工具 ————————————————————
const $ = (s, el = document) => el.querySelector(s)
const byId = (arr, id) => arr.find(x => x.id === +id)
const P = id => byId(persons, id), E = id => byId(events, id), B = id => byId(books, id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`
const val = r => r.amt + r.gv
const live = () => R.filter(r => !B(r.b).merged)
function yuan(n, sign) { const s = Math.abs(n).toLocaleString('en-US'); return (sign ? (n < 0 ? '−' : '+') : (n < 0 ? '−' : '')) + '¥' + s }
function compact(n) { return Math.abs(n) >= 100000 ? '¥' + (n / 10000).toFixed(2).replace(/\.?0+$/, '') + '万' : yuan(n) }
function fdate(d, prec = 'day') {
  if (!d) return '<span class="muted">未注明</span>'
  const [y, m, dd] = d.split('-').map(Number), cur = y === +TODAY.slice(0, 4)
  if (prec === 'year') return `${y}年<span class="approx">约</span>`
  if (prec === 'month') return `${cur ? '' : y + '年'}${m}月<span class="approx">约</span>`
  return `${cur ? '' : y + '年'}${m}月${dd}日`
}
function ago(d) {
  const a = new Date(TODAY), b = new Date(d), mo = (a.getFullYear() - b.getFullYear()) * 12 + a.getMonth() - b.getMonth()
  return mo < 1 ? '本月' : mo < 12 ? `${mo} 个月前` : `${Math.floor(mo / 12)} 年前`
}
function upper(n) {
  if (!n) return ''
  const d = '零壹贰叁肆伍陆柒捌玖', u = ['', '拾', '佰', '仟']
  const sec = x => { let s = '', z = false; for (let i = 3; i >= 0; i--) { const g = Math.floor(x / 10 ** i) % 10; if (!g) { if (s) z = true } else { if (z) { s += '零'; z = false } s += d[g] + u[i] } } return s }
  const hi = Math.floor(n / 10000), lo = n % 10000
  let s = hi ? sec(hi) + '万' : ''
  if (lo) s += (hi && lo < 1000 ? '零' : '') + sec(lo)
  return s + '元'
}
function seal(ev, lg) { const [ch, c] = TYPES[ev.type]; const [m, l] = PAL[c]; return `<span class="seal${lg ? ' lg' : ''}" style="color:${m};background:${l}" title="${ev.type}">${ch}</span>` }
function avatar(p) { const c = Object.values(PAL)[p.id % 8]; return `<span class="avatar" style="background:${c[1]};color:${c[0]}">${esc(p.name.slice(-1))}</span>` }
function catChip(cat) { const [m, l] = PAL[BOOK_CATS[cat] || 'stone']; return `<span class="pill" style="background:${l};color:${m}">${esc(cat)}</span>` }
function dirTag(r) { return `<span class="dir ${r.dir === '收' ? 'in' : 'out'}">${r.dir}</span>` }
function money(r, cls) {
  if (!r.amt && r.gift) return `<span class="cell-2" style="justify-content:flex-end">${icon('gift')}<span class="t" style="text-align:right">${esc(r.gift)}${r.gv ? `<small>估 ${yuan(r.gv)}</small>` : ''}</span></span>`
  return `<span class="amt ${cls || (r.dir === '收' ? 'in' : 'out')}">${yuan(r.amt)}</span>`
}
function statusOf(r) {
  if (r.repayOf.length) return ['back', '回礼']
  const t = r.dir === '收' ? { pending: '未回礼', repaid: '已回礼', none: '不用回' } : { pending: '对方未回', repaid: '对方已回', none: '不用回' }
  return [r.status, t[r.status]]
}
const pill = r => { const [c, t] = statusOf(r); return `<span class="pill ${c}">${t}</span>` }
const isOwe = r => r.dir === '收' && r.status === 'pending'
function sum(rs) { const o = { in: 0, out: 0, n: rs.length, owe: 0, oweN: 0 }; rs.forEach(r => { if (r.dir === '收') o.in += val(r); else o.out += val(r); if (isOwe(r)) { o.owe += val(r); o.oweN++ } }); return o }
function groupBy(rs, key) { const m = new Map(); rs.forEach(r => { const k = key(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r) }); return m }

function recTable(rs, opt = {}) {
  if (!rs.length) return `<div class="empty">没有符合条件的记录</div>`
  const cols = opt.cols || ['date', 'person', 'event', 'book', 'cat', 'amt', 'status']
  const H = { chk: '', date: '日期', person: '亲友', event: '事项', book: '礼簿', cat: '名目', amt: '<span style="display:block;text-align:right">金额</span>', status: '状态', page: '纸本', anno: '纸本标注', ops: '' }
  const C = {
    chk: r => isOwe(r) ? `<input type="checkbox" class="chk" data-owe="${r.id}" ${st.selOwe.has(r.id) ? 'checked' : ''} aria-label="选中">` : '',
    date: r => `<span class="sm">${fdate(r.date)}</span>`,
    person: r => { const p = P(r.p); return `<a class="cell-2" href="#person-${p.id}" data-stop>${avatar(p)}<span class="t">${esc(p.name)}<small>${p.rel}</small></span></a>` },
    event: r => { const e = E(r.e); return `<span class="cell-2">${seal(e)}<span class="t">${esc(e.name)}</span></span>` },
    book: r => `<span class="sm">${esc(B(r.b).name)}</span>`,
    cat: r => `<span class="sm muted">${r.cat}</span>`,
    amt: r => `<div style="display:flex;justify-content:flex-end;gap:8px;align-items:center">${dirTag(r)}${money(r)}</div>`,
    status: r => pill(r),
    page: r => `<span class="sm muted">${esc(r.page) || '—'}</span>`,
    anno: r => r.anno ? `<span class="sm">${esc(r.anno)}</span>` : '<span class="muted sm">—</span>',
    ops: r => opt.ops(r),
  }
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${H[c]}</th>`).join('')}</tr></thead><tbody>${rs.map(r => `<tr class="link${st.recSel === r.id ? ' sel' : ''}" data-rec="${r.id}">${cols.map((c, i) => `<td class="${i === 0 && isOwe(r) ? 'pend-bar' : ''}">${C[c](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
}

function filterRecords(rs, f) {
  return rs.filter(r => {
    const p = P(r.p), e = E(r.e), b = B(r.b)
    if (f.cat && b.cat !== f.cat) return false
    if (f.type && e.type !== f.type) return false
    if (f.person && !(p.name.includes(f.person) || p.py.startsWith(f.person.toLowerCase()))) return false
    if (f.year && !r.date.startsWith(f.year)) return false
    if (f.dir && r.dir !== f.dir) return false
    if (f.item && r.cat !== f.item) return false
    if (f.status) { if (r.dir !== (f.dir || '收')) return false; if (r.repayOf.length || r.status !== f.status) return false }
    return true
  })
}

  const opt = (arr, v, ph) => `<option value="">${ph}</option>` + arr.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('')
  const years = [...new Set(R.map(r => r.date.slice(0, 4)))].sort().reverse()
  const stLabels = (f.dir || '收') === '收' ? [['pending', '未回礼'], ['repaid', '已回礼'], ['none', '不用回']] : [['pending', '对方未回'], ['repaid', '对方已回'], ['none', '不用回']]
  return `<div class="filters" data-scope="${scope}">
    <select class="ipt" data-f="cat" aria-label="礼簿类别">${opt(Object.keys(BOOK_CATS), f.cat, '礼簿类别')}</select>
    <select class="ipt" data-f="type" aria-label="事项类型">${opt(Object.keys(TYPES), f.type, '事项类型')}</select>

}

    <div class="page-head"><div><h1>亲友</h1><div class="meta">${persons.length} 人；同一人只有一个条目，往来跨全部礼簿合计</div></div><div class="tools"><button class="btn" data-act="newPerson">${icon('plus')}新建亲友</button></div></div>
    <div class="card">
      <div class="filters"><input class="ipt" id="pq2" value="${esc(st.peopleQ)}" placeholder="姓名或拼音首字母，如 zjg" style="width:240px" aria-label="搜索亲友">
        <div class="seg" data-act="rel">${['', ...RELS].map(v => `<button data-v="${v}" class="${st.peopleRel === v ? 'on' : ''}">${v || '全部'}</button>`).join('')}</div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>姓名</th><th>关系</th><th class="r">总收</th><th class="r">总送</th><th class="r">净差额</th><th class="r">未回礼</th><th>最近往来</th></tr></thead><tbody>
      ${list.map(({ p, s, last }) => `<tr class="link" data-href="person-${p.id}"><td class="${s.oweN ? 'pend-bar' : ''}"><span class="cell-2">${avatar(p)}<span class="t">${esc(p.name)}<small>${esc(p.note) || '&nbsp;'}</small></span></span></td><td class="sm">${p.rel}</td><td class="r"><span class="amt in">${yuan(s.in)}</span></td><td class="r"><span class="amt out">${yuan(s.out)}</span></td><td class="r amt">${yuan(s.in - s.out, true)}</td><td class="r">${s.oweN ? `<span class="amt pend">${s.oweN} 笔 ${yuan(s.owe)}</span>` : '<span class="muted">—</span>'}</td><td class="sm muted">${last ? ago(last) : '—'}</td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">没有找到，试试拼音首字母</div></td></tr>'}
      </tbody></table></div>
    </div>`,
    after() { const i = $('#pq2'); i.oninput = () => { st.peopleQ = i.value; const pos = i.selectionStart; render(); const j = $('#pq2'); j.focus(); j.setSelectionRange(pos, pos) } },
  }
}

PAGES.person = id => {
  const p = P(id); if (!p) return PAGES.people()
  const all = live().filter(r => r.p === p.id), s = sum(all)
  const groups = [...groupBy([...all].sort((a, b) => b.date.localeCompare(a.date)), r => r.e)]
  const sel = [...st.selOwe].filter(i => all.some(r => r.id === i))
  return {
    title: p.name, crumbs: [['亲友', 'people']], nav: 'people', html: `
    <div class="page-head"><div class="profile">${avatar(p)}<div><h1>${esc(p.name)}</h1><div class="meta">${p.rel}${p.phone ? ' · ' + p.phone : ''}${p.note ? ' · ' + esc(p.note) : ''}</div></div></div>
      <div class="tools"><button class="btn" data-act="editPerson" data-id="${p.id}">${icon('edit')}编辑</button><button class="btn" data-act="repay" ${sel.length ? '' : 'disabled'} title="先勾选要回的收礼记录">${icon('return')}回礼${sel.length ? ` · 已选 ${sel.length} 笔` : ''}</button><button class="btn primary" data-act="entry" data-p="${p.id}">${icon('plus')}给 ${esc(p.name)} 记一笔</button></div></div>
    <div class="stats">
      <div class="card stat"><div class="v" style="color:var(--c-in)">${yuan(s.in)}</div><div class="k">总收</div></div>
      <div class="card stat"><div class="v" style="color:var(--c-out)">${yuan(s.out)}</div><div class="k">总送</div></div>
      <div class="card stat"><div class="v">${yuan(s.in - s.out, true)}</div><div class="k">净差额</div></div>
      <div class="card stat"><div class="v" style="color:var(--c-pending)">${s.oweN} 笔 · ${yuan(s.owe)}</div><div class="k">未回礼（勾选后点"回礼"）</div></div>
    </div>
    <section class="section">
      <div class="sec-head"><h2>往来时间线</h2><span class="sub">按事项分组；同一事项跨礼簿、跨名目合计</span></div>
      <div class="card">${groups.map(([eid, rs]) => { const e = E(eid), t = sum(rs); return `<div class="group"><div class="group-head">${seal(e)}<div class="t"><a href="#event-${e.id}"><b>${esc(e.name)}</b></a><small>${fdate(e.date)} · ${e.host} · ${rs.length} 笔分布在 ${new Set(rs.map(r => r.b)).size} 本礼簿</small></div><div class="subtotal">${t.in ? `<span>收 <b class="amt in">${yuan(t.in)}</b></span>` : ''}${t.out ? `<span>送 <b class="amt out">${yuan(t.out)}</b></span>` : ''}</div></div>${recTable(rs, { cols: ['chk', 'date', 'book', 'cat', 'amt', 'status'] })}</div>` }).join('') || '<div class="empty">还没有往来</div>'}</div>
    </section>`,
  }
}

PAGES.events = () => {
  const rows = events.map(e => ({ e, s: sum(live().filter(r => r.e === e.id)), ppl: new Set(live().filter(r => r.e === e.id).map(r => r.p)).size })).sort((a, b) => (b.e.date || '0').localeCompare(a.e.date || '0'))
  return {
    title: '事项', html: `
    <div class="page-head"><div><h1>事项</h1><div class="meta">一次具体的人情事件；自家办的看"谁来了"，别人家办的看"我送了多少"</div></div><div class="tools"><button class="btn" data-act="todo" data-msg="新建事项：名称、类型、日期、地点、主办方、备注">${icon('plus')}新建事项</button></div></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>事项</th><th>日期</th><th>主办方</th><th class="r">人数</th><th class="r">收</th><th class="r">送</th><th class="r">未回礼</th></tr></thead><tbody>
    ${rows.map(({ e, s, ppl }) => `<tr class="link" data-href="event-${e.id}"><td><span class="cell-2">${seal(e)}<span class="t">${esc(e.name)}<small>${e.type}${e.place ? ' · ' + esc(e.place) : ''}</small></span></span></td><td class="sm">${fdate(e.date)}</td><td><span class="pill ${e.host === '自家办' ? 'neutral' : 'none'}">${e.host}</span></td><td class="r num">${ppl}</td><td class="r">${s.in ? `<span class="amt in">${yuan(s.in)}</span>` : '<span class="muted">—</span>'}</td><td class="r">${s.out ? `<span class="amt out">${yuan(s.out)}</span>` : '<span class="muted">—</span>'}</td><td class="r">${s.oweN ? `<span class="amt pend">${s.oweN} 笔</span>` : '<span class="muted">—</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>`,
  }
}

PAGES.event = id => {
  const e = E(id); if (!e) return PAGES.events()
  const rs = live().filter(r => r.e === e.id), s = sum(rs)
  const byP = [...groupBy(rs, r => r.p)].map(([pid, l]) => ({ p: P(pid), l, s: sum(l), back: R.filter(x => x.repayOf.some(o => l.some(r => r.id === o))) }))
  const views = { came: ['谁来了', byP.filter(x => x.s.in)], back: ['我回了', byP.filter(x => x.back.length)], owe: ['还有谁没回', byP.filter(x => x.s.oweN)] }
  const list = views[st.eventView][1]
  return {
    title: e.name, crumbs: [['事项', 'events']], nav: 'events', html: `
    <div class="page-head"><div class="profile">${seal(e, true)}<div><h1>${esc(e.name)}</h1><div class="meta">${e.type} · ${fdate(e.date)} · ${e.host}${e.place ? ' · ' + esc(e.place) : ''}</div></div></div>
      <div class="tools"><button class="btn" data-act="todo" data-msg="编辑事项；删除只在事项下没有记录时可用">${icon('edit')}编辑</button><button class="btn primary" data-act="entry" data-e="${e.id}">${icon('plus')}在此事项记一笔</button></div></div>
    <div class="stats">
      <div class="card stat"><div class="v" style="color:var(--c-in)">${yuan(s.in)}</div><div class="k">总收入</div></div>
      <div class="card stat"><div class="v" style="color:var(--c-out)">${yuan(s.out)}</div><div class="k">总送出</div></div>
      <div class="card stat"><div class="v">${byP.length}</div><div class="k">参与人数</div></div>
      <div class="card stat"><div class="v">${rs.filter(r => r.dir === '收' && r.status === 'repaid').length} / <span style="color:var(--c-pending)">${s.oweN}</span></div><div class="k">已回礼 / 未回礼笔数</div></div>
    </div>
    <section class="section">
      <div class="sec-head"><div class="seg" data-act="eview">${Object.entries(views).map(([k, [t, l]]) => `<button data-v="${k}" class="${st.eventView === k ? 'on' : ''}">${t} <span class="num muted">${l.length}</span></button>`).join('')}</div><span class="sub">按人合计，点开看分礼簿、分名目明细</span></div>
      <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>亲友</th><th>明细</th><th class="r">${st.eventView === 'back' ? '我回了' : '合计'}</th><th>状态</th></tr></thead><tbody>
      ${list.map(x => `<tr class="link" data-href="person-${x.p.id}"><td class="${x.s.oweN ? 'pend-bar' : ''}"><span class="cell-2">${avatar(x.p)}<span class="t">${esc(x.p.name)}<small>${x.p.rel}</small></span></span></td>
        <td class="sm">${(st.eventView === 'back' ? x.back : x.l).map(r => `<span class="muted">${esc(B(r.b).name)} · ${r.cat}</span> ${r.amt ? yuan(r.amt) : esc(r.gift)}`).join('<br>')}</td>
        <td class="r">${st.eventView === 'back' ? `<span class="amt out">${yuan(x.back.reduce((a, r) => a + val(r), 0))}</span>` : `<span class="amt ${x.s.in ? 'in' : 'out'}">${yuan(x.s.in || x.s.out)}</span>`}</td>
        <td>${x.s.oweN ? `<span class="pill pending">未回礼 ${x.s.oweN} 笔</span>` : x.back.length ? '<span class="pill repaid">已回礼</span>' : pill(x.l[0])}</td></tr>`).join('') || '<tr><td colspan="4"><div class="empty">这里没有人</div></td></tr>'}
      </tbody></table></div></div>
    </section>`,
  }
}

PAGES.books = () => {
  const act = books.filter(b => !b.merged), mer = books.filter(b => b.merged)
  const row = b => { const rs = R.filter(r => r.b === b.id), s = sum(rs), ev = E(b.ev); return `<tr class="link" data-href="book-${b.id}"><td><span class="cell-2"><span class="seal" style="color:${PAL[BOOK_CATS[b.cat]][0]};background:${PAL[BOOK_CATS[b.cat]][1]}">簿</span><span class="t">${esc(b.name)}<small>${esc(b.desc) || '&nbsp;'}</small></span></span></td><td>${catChip(b.cat)}</td><td class="sm">${ev ? esc(ev.name) : '<span class="muted">—</span>'}</td><td class="r num">${rs.length}</td><td class="r">${s.in ? `<span class="amt in">${yuan(s.in)}</span>` : '<span class="muted">—</span>'}</td><td class="r">${s.out ? `<span class="amt out">${yuan(s.out)}</span>` : '<span class="muted">—</span>'}</td><td class="sm">${b.merged ? `并入《${esc(B(b.merged).name)}》` : `<span class="muted">${Object.keys(b.pages).length ? Object.keys(b.pages).length + ' 页已核对' : ''}</span>`}</td></tr>` }
  const head = '<thead><tr><th>礼簿</th><th>类别</th><th>默认事项</th><th class="r">记录</th><th class="r">收</th><th class="r">送</th><th></th></tr></thead>'
  return {
    title: '礼簿', html: `
    <div class="page-head"><div><h1>礼簿</h1><div class="meta">一本纸质礼簿对应一本；设了默认事项后，记账、连续录入、识别都自动带出</div></div><div class="tools"><button class="btn" data-act="merge">${icon('merge')}合并礼簿</button><button class="btn" data-act="todo" data-msg="新建礼簿：名称、类别（人情礼/火炮/其他）、默认事项、描述">${icon('plus')}新建礼簿</button></div></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl">${head}<tbody>${act.map(row).join('')}</tbody></table></div></div>
    <section class="section"><div class="sec-head"><h2>已合并</h2><span class="sub">不出现在默认列表；记录已归到目标礼簿，保留原礼簿以便追溯</span></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl">${head}<tbody>${mer.map(row).join('')}</tbody></table></div></div></section>`,
  }
}

function pageRows(b) {
  const rs = R.filter(r => r.b === b.id && r.page), marks = [...new Set([...Object.keys(b.pages), ...rs.map(r => r.page)])].sort()
  return marks.map(m => { const l = rs.filter(r => r.page === m), got = l.reduce((a, r) => a + val(r), 0), paper = b.pages[m]; return { b, m, n: l.length, got, paper, diff: paper == null ? null : got - paper } })
}

PAGES.book = id => {
  const b = B(id); if (!b) return PAGES.books()
  const rs = R.filter(r => r.b === b.id).sort((a, c) => (a.page || 'z').localeCompare(c.page || 'z') || a.id - c.id), s = sum(rs), ev = E(b.ev)
  const notes = rs.filter(r => r.anno && !r.annoDone), pr = pageRows(b)
  const tabs = { records: ['记录', rs.length], cont: ['连续录入', null], pages: ['按页核对', pr.length], notes: ['整理纸本标注', notes.length] }
  let body = ''
  if (st.bookTab === 'records') body = recTable(rs, { cols: ['page', 'person', 'event', 'cat', 'amt', 'status', 'anno'] })
  if (st.bookTab === 'pages') body = pagesTable(pr)
  if (st.bookTab === 'notes') body = notesTable(notes)
  if (st.bookTab === 'cont') body = contForm(b)
  return {
    title: b.name, crumbs: [['礼簿', 'books']], nav: 'books', html: `
    ${b.merged ? `<div class="alert info">${icon('info')}<span>这本礼簿已并入《${esc(B(b.merged).name)}》，只读查看。</span></div>` : ''}
    <div class="page-head"><div><h1>${esc(b.name)}</h1><div class="meta">${catChip(b.cat)} &nbsp;默认事项：${ev ? esc(ev.name) : '无'}${b.desc ? ' · ' + esc(b.desc) : ''}</div></div>
      <div class="tools"><button class="btn" data-act="merge" data-src="${b.id}">${icon('merge')}合并到…</button><button class="btn" data-act="todo" data-msg="编辑礼簿；删除只在礼簿下没有记录时可用">${icon('edit')}编辑</button><button class="btn primary" data-act="entry" data-b="${b.id}">${icon('plus')}在本簿记一笔</button></div></div>
    <div class="stats">
      <div class="card stat"><div class="v num">${s.n}</div><div class="k">记录</div></div>
      <div class="card stat"><div class="v" style="color:var(--c-in)">${yuan(s.in)}</div><div class="k">收</div></div>
      <div class="card stat"><div class="v" style="color:var(--c-out)">${yuan(s.out)}</div><div class="k">送</div></div>
      <div class="card stat"><div class="v" style="color:var(--c-pending)">${s.oweN} 笔</div><div class="k">未回礼</div></div>
    </div>
    <div class="tabs" role="tablist">${Object.entries(tabs).map(([k, [t, n]]) => `<button data-act="btab" data-v="${k}" class="${st.bookTab === k ? 'on' : ''}">${t}${n != null ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
    <div class="card">${body}</div>`,
    after() { if (st.bookTab === 'cont') { const n = $('#c-name'); n && n.focus() } },
  }
}

function pagesTable(pr) {
  if (!pr.length) return '<div class="empty">还没有填纸本页码。连续录入和识别时填上"纸本标记"与"本页合计"，这里就能逐页对账。</div>'
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>礼簿</th><th>纸本标记</th><th class="r">笔数</th><th class="r">纸本合计</th><th class="r">录入合计</th><th class="r">差额</th><th></th></tr></thead><tbody>
  ${pr.map(x => `<tr><td class="sm">${esc(x.b.name)}</td><td class="num">${x.m}</td><td class="r num">${x.n}</td><td class="r num">${x.paper == null ? '<span class="muted">未填</span>' : yuan(x.paper)}</td><td class="r num">${yuan(x.got)}</td><td class="r">${x.diff == null ? '<span class="muted">—</span>' : x.diff === 0 ? `<span class="pill repaid">${icon('check').replace('class="i"', 'class="i" style="width:14px;height:14px"')}对上了</span>` : `<span class="pill warn">${yuan(x.diff, true)}</span>`}</td><td class="r"><a class="btn text sm" href="#book-${x.b.id}" data-tab="records">查看</a></td></tr>`).join('')}
  </tbody></table></div>`
}
function notesTable(rs) {
  if (!rs.length) return '<div class="empty">纸本标注都已整理完</div>'
  return `<div class="filters"><span class="sm muted">${rs.length} 条标注还没转为回礼。系统已按原文预填时间、事项与金额，逐条核对后转换。</span><div class="right"><button class="btn sm" data-act="annoAll">全部按预填转换</button></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>亲友</th><th>原记录</th><th>标注原文</th><th>预填的回礼</th><th></th></tr></thead><tbody>
  ${rs.map(r => { const p = P(r.p), parsed = parseAnno(r.anno); return `<tr><td class="pend-bar"><span class="cell-2">${avatar(p)}<span class="t">${esc(p.name)}<small>${esc(B(r.b).name)} · ${r.page}</small></span></span></td><td>${money(r)}</td><td style="font-family:var(--serif)">${esc(r.anno)}</td><td class="sm">${parsed.map(x => `${fdate(x.date, x.prec)} · ${esc(x.ev)} · ${x.cat} <b class="amt out">${yuan(x.amt)}</b>`).join('<br>')}</td><td class="r"><button class="btn sm" data-act="anno" data-id="${r.id}">核对并转换</button></td></tr>` }).join('')}
  </tbody></table></div>`
}
function contForm(b) {
  const c = st.cont, got = c.rows.reduce((a, r) => a + r.amt, 0), tot = +c.total || 0
  return `<div class="ctx">
    <div class="field"><label>事项</label><select class="ipt" id="c-ev">${events.map(e => `<option value="${e.id}" ${e.id === (b.ev || c.ev) ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
    <div class="field"><label>日期</label><input class="ipt" id="c-date" type="date" value="${c.date}"></div>
    <div class="field"><label>纸本标记</label><input class="ipt" id="c-page" value="${esc(c.page)}" style="width:90px"></div>
    <div class="field"><label>本页合计</label><input class="ipt num" id="c-total" value="${esc(c.total)}" placeholder="选填" style="width:100px" inputmode="numeric"></div>
    <div class="page-check">${tot ? (got === tot ? `<span class="pill repaid">本页对上了 ${yuan(got)}</span>` : `<span class="pill warn">已录 ${yuan(got)}，差 ${yuan(got - tot, true)}</span>`) : `<span class="muted">已录 ${c.rows.length} 笔 ${yuan(got)}</span>`}</div>
  </div>
  <form class="entry-row" id="c-form" autocomplete="off">
    <input class="ipt" id="c-name" placeholder="姓名" list="dl-people" aria-label="姓名">
    <input class="ipt num" id="c-amt" placeholder="金额" inputmode="numeric" aria-label="金额">
    <select class="ipt" id="c-cat" aria-label="名目">${ITEM_CATS.map(x => `<option ${x === (b.cat === '火炮' ? '火炮' : '现金') ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <input class="ipt" id="c-anno" placeholder="纸本回礼标注原文（选填），如：11年国庆 孙女 100元" aria-label="标注原文">
    <button class="btn primary" type="submit">记下 <kbd style="background:rgba(255,255,255,.18);color:#fff;border-color:transparent">Enter</kbd></button>
  </form>
  <datalist id="dl-people">${persons.map(p => `<option value="${esc(p.name)}">`).join('')}</datalist>
  ${c.rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>姓名</th><th>名目</th><th class="r">金额</th><th>标注原文</th><th></th></tr></thead><tbody>${c.rows.map((r, i) => `<tr><td class="num muted">${c.rows.length - i}</td><td>${esc(r.name)}${r.isNew ? ' <span class="pill neutral">新亲友</span>' : ''}${r.dup ? ' <span class="pill pending">可能重复</span>' : ''}</td><td class="sm muted">${r.cat}</td><td class="r"><span class="amt in">${yuan(r.amt)}</span></td><td class="sm">${esc(r.anno) || '<span class="muted">—</span>'}</td><td class="r"><button class="btn text sm" data-act="cundo" data-i="${i}">撤销</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">输入姓名、金额，按 Enter 记下一笔；事项、日期、纸本标记保持不变，光标回到姓名。</div>'}`

function monthChart(rs) {
  const m = Array.from({ length: 12 }, () => ({ in: 0, out: 0 }))
  rs.forEach(r => { const i = +r.date.slice(5, 7) - 1; m[i][r.dir === '收' ? 'in' : 'out'] += val(r) })
  const mx = Math.max(...m.map(x => Math.max(x.in, x.out)), 1), step = mx > 4000 ? 2000 : mx > 2000 ? 1000 : 500, top = Math.ceil(mx / step) * step
  const W = 960, H = 240, L = 56, Bt = 28, T = 12, cw = (W - L - 8) / 12, sc = v => (H - Bt - T) * v / top
  let g = ''
  for (let v = 0; v <= top; v += step) { const yy = H - Bt - sc(v); g += `<line x1="${L}" x2="${W - 8}" y1="${yy}" y2="${yy}" stroke="var(--c-divider)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--c-ink-3)">${v ? (v >= 10000 ? v / 10000 + '万' : v.toLocaleString()) : 0}</text>` }
  m.forEach((x, i) => {
    const cx = L + cw * i + cw / 2
    g += `<rect x="${cx - 13}" y="${H - Bt - sc(x.in)}" width="12" height="${sc(x.in)}" rx="3" fill="var(--c-in)"><title>${i + 1}月 收 ${yuan(x.in)}</title></rect>`
    g += `<rect x="${cx + 1}" y="${H - Bt - sc(x.out)}" width="12" height="${sc(x.out)}" rx="3" fill="var(--c-out)"><title>${i + 1}月 送 ${yuan(x.out)}</title></rect>`
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--c-ink-3)">${i + 1}月</text>`
  })
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="按月收送柱状图">${g}</svg>`
}

function bindDrop() {
  const d = $('#drop'), f = $('#file')
  const done = () => { st.recog.step = 2; render(); setTimeout(() => { if (st.recog && st.recog.step === 2) { const s = recogSample(); s.rot = st.recog.rot; st.recog = s; if (route()[0] === 'recognize') render() } }, 1600) }
  d.ondragover = e => { e.preventDefault(); d.classList.add('over') }
  d.ondragleave = () => d.classList.remove('over')
  d.ondrop = e => { e.preventDefault(); done() }
  f.onchange = done
  d.onclick = e => { if (e.target !== f) { e.preventDefault(); done() } }
}

function parseAnno(s) {
  if (!s || s === '已回') return []
  const lines = s.split(/\n/)
  return lines.flatMap(line => {
    const yy = (line.match(/(\d{2})年/) || [])[1], mo = line.includes('正月') ? 1 : line.includes('国庆') ? 10 : +((line.match(/(\d{1,2})月/) || [])[1] || 0), dd = +((line.match(/(\d{1,2})日/) || [])[1] || 0)
    const y = yy ? 2000 + +yy : 2011, prec = dd ? 'day' : mo ? 'month' : 'year'
    const date = `${y}-${String(mo || 1).padStart(2, '0')}-${String(dd || 1).padStart(2, '0')}`
    const ev = ((line.replace(/\d{2}年|\d{1,2}月|\d{1,2}日|正月|国庆|火炮\s*\d+元?|\d+元?/g, ' ').trim().split(/\s+/)[0]) || '纸本未注明事项')
    const items = [], pao = line.match(/火炮\s*(\d+)/)
    const rest = line.replace(/火炮\s*\d+元?/, '').replace(/\d{2}年|\d{1,2}月|\d{1,2}日/g, '')
    const cash = rest.match(/(\d+)\s*元?/)
    if (cash) items.push({ cat: '现金', amt: +cash[1] })
    if (pao) items.push({ cat: '火炮', amt: +pao[1] })
    return items.map(it => ({ date, prec, ev, ...it }))
  })
}

        ${items.map(x => `<tr><td><input class="ipt" type="date" value="${x.date}" style="width:140px"></td><td><select class="ipt" style="width:70px">${[['day', '日'], ['month', '月'], ['year', '年']].map(([k, t]) => `<option ${k === x.prec ? 'selected' : ''}>${t}</option>`).join('')}</select></td><td><input class="ipt" value="${esc(x.ev)}" style="width:110px"></td><td class="sm">${x.cat}</td><td class="r"><span class="amt out">${yuan(x.amt)}</span></td></tr>`).join('')}
        </tbody></table></div>

function search(q) {
  q = q.trim(); const out = { 亲友: [], 事项: [], 礼簿: [], 记录: [] }
  if (!q) return out
  const lc = q.toLowerCase(), cn = { 壹: 1, 贰: 2, 叁: 3, 肆: 4, 伍: 5, 陆: 6, 柒: 7, 捌: 8, 玖: 9 }
  let m
  const rs = live()
  if ((m = q.match(/^(\d+)\s*-\s*(\d+)$/))) out.记录 = rs.filter(r => r.amt >= +m[1] && r.amt <= +m[2])
  else if ((m = q.match(/^(19|20)\d{2}$/))) out.记录 = rs.filter(r => r.date.startsWith(q))
  else if ((m = q.match(/^(\d{2})年$/))) out.记录 = rs.filter(r => r.date.startsWith('20' + m[1]))
  else if (/^\d+$/.test(q)) out.记录 = rs.filter(r => r.amt === +q)
  else if (/^p\d/i.test(q)) out.记录 = rs.filter(r => r.page.toLowerCase().startsWith(lc))
  else if ((m = q.match(/^([壹贰叁肆伍陆柒捌玖])([仟佰拾])/))) { const n = cn[m[1]] * { 仟: 1000, 佰: 100, 拾: 10 }[m[2]]; out.记录 = rs.filter(r => r.amt === n) }
  else {
    out.亲友 = persons.filter(p => p.name.includes(q) || p.py.startsWith(lc))
    out.事项 = events.filter(e => e.name.includes(q))
    out.礼簿 = books.filter(b => b.name.includes(q))
    out.记录 = rs.filter(r => r.note.includes(q) || r.gift.includes(q) || r.anno.includes(q))
  }
  out.记录 = out.记录.slice(0, 8)
  return out
}
function renderSearch() {
  const q = $('#pq').value, res = search(q)
  const any = Object.values(res).some(l => l.length)
  const tips = ['zjg', '500', '500-1000', '伍佰', '2011', '11年', 'p1-10', '火炮']
  $('#pres').innerHTML = !q.trim() ? `<div class="tips">试试：${tips.map(t => `<button data-tip="${t}">${t}</button>`).join('')}</div>` : !any ? '<div class="empty">没有找到。金额、年份、页码也能搜</div>' : Object.entries(res).filter(([, l]) => l.length).map(([k, l]) => `<h6>${k}</h6>` + l.map(x => {
    if (k === '亲友') return `<a href="#person-${x.id}">${avatar(x)}<span class="grow">${esc(x.name)} <small>${x.rel} · ${x.py}</small></span></a>`
    if (k === '事项') return `<a href="#event-${x.id}">${seal(x)}<span class="grow">${esc(x.name)} <small>${fdate(x.date)}</small></span></a>`
    if (k === '礼簿') return `<a href="#book-${x.id}">${icon('book')}<span class="grow">${esc(x.name)} <small>${x.cat}${x.merged ? ' · 已合并' : ''}</small></span></a>`
    return `<a href="#records" data-rec="${x.id}">${dirTag(x)}<span class="grow">${esc(P(x.p).name)} · ${esc(E(x.e).name)} <small>${esc(B(x.b).name)}${x.page ? ' · ' + x.page : ''} · ${fdate(x.date)}</small></span>${money(x)}</a>`
  }).join('')).join('')
}

  render()
})
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)
  if (e.key === 'Escape') { closeAll(); return }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return }
  if (typing) {
    if ($('#palette').classList.contains('on') && e.key === 'Enter') { const a = $('#pres a'); if (a) a.click() }
    return
  }
  if (e.key === '/') { e.preventDefault(); openSearch() }
  if (e.key.toLowerCase() === 'n') { e.preventDefault(); openEntry() }
})
document.addEventListener('paste', e => { if (route()[0] === 'recognize' && st.recog && st.recog.step === 1 && e.clipboardData.files.length) { $('#drop').click() } })
window.addEventListener('hashchange', () => { closeAll(); st.recSel = 0; st.bookTab = st.nextTab || 'records'; st.nextTab = ''; window.scrollTo(0, 0); render() })
render()
</script>
</body>
</html>
